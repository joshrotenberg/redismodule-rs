name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and run the unit tests using the latest rust.
    runs-on: ${{ matrix.os }}
    env:
      # One job checks that the committed bindings are what bindgen generates;
      # the others would depend on each runner's LLVM version.
      REDISMODULE_RS_CHECK_BINDINGS: ${{ matrix.os == 'ubuntu-latest' && matrix.redis-version[0] == '8-0' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        redis-version:
          - [6-0, "7.2"]
          - [6-2, "7.2"]
          - [7-0, "7.2"]
          - [7-2, "7.2"]
          - [7-4, "7.4"]
          - [8-0, "8.0"]
        toolchain:
          - stable
        # macOS runs the lowest and highest floors; Linux runs them all.
        exclude:
          - os: macos-latest
            redis-version: [6-2, "7.2"]
          - os: macos-latest
            redis-version: [7-0, "7.2"]
          - os: macos-latest
            redis-version: [7-2, "7.2"]
          - os: macos-latest
            redis-version: [7-4, "7.4"]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Checkout redis sources
        uses: actions/checkout@v5
        with:
          submodules: recursive
          repository: redis/redis
          ref: ${{ matrix.redis-version[1] }}
          path: redis

      - name: Install redis
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          cd redis
          make -j
          ./src/redis-server --version
          make install PREFIX=/usr/local
          redis-server --version

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Clang (for bindgen)
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y libclang-dev
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            # Install LLVM which provides libclang
            brew install llvm
            # Set environment variables for bindgen to find libclang
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
            echo "LLVM_CONFIG_PATH=$(brew --prefix llvm)/bin/llvm-config" >> "$GITHUB_ENV"
          fi

      - name: Install toolchain
        id: tc
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features --features min-redis-compatibility-version-${{ matrix.redis-version[0] }},bindgen-runtime -- -D warnings

      - name: Build debug
        run: cargo build --no-default-features --features min-redis-compatibility-version-${{ matrix.redis-version[0] }},bindgen-runtime

      - name: Build release
        run: cargo build --release --no-default-features --features min-redis-compatibility-version-${{ matrix.redis-version[0] }},bindgen-runtime

      - name: Test
        run: cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.redis-version[0] }},bindgen-runtime

      - name: Lint and test the system allocator fallback
        run: |
          cargo clippy --all-targets --no-default-features --features min-redis-compatibility-version-${{ matrix.redis-version[0] }},bindgen-runtime,system-allocator-fallback -- -D warnings
          cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.redis-version[0] }},bindgen-runtime,system-allocator-fallback --test system_allocator_fallback

      - name: Doc
        run: cargo doc --no-default-features --features "all-features-but-xor bindgen-runtime min-redis-compatibility-version-${{ matrix.redis-version[0] }}"

  msrv:
    # Without clang installed, so the default build with the committed
    # bindings is checked too.
    name: Check and run the unit tests with the minimum supported Rust (1.87).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.87"
          # The stable jobs deny warnings. Here a lint added after 1.87, named
          # in an allow attribute, would fail as an unknown lint.
          rustflags: ""

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Unit tests
        run: cargo test --lib
