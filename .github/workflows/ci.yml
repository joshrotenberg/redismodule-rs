name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The default build, with the committed bindings, on the toolchain that
    # rust-toolchain.toml pins.
    name: Build and test (floor ${{ matrix.floor }}, ${{ matrix.server }} ${{ matrix.version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUST_TEST_THREADS: "4"
    strategy:
      fail-fast: false
      matrix:
        # Linux covers every API floor and newer server release lines. macOS
        # covers the lowest floor and the newest Redis release.
        include:
          - {os: ubuntu-latest, server: redis, version: "7.2.16", floor: "6-0"}
          - {os: ubuntu-latest, server: redis, version: "7.2.16", floor: "6-2"}
          - {os: ubuntu-latest, server: redis, version: "7.2.16", floor: "7-0"}
          - {os: ubuntu-latest, server: redis, version: "7.2.16", floor: "7-2"}
          - {os: ubuntu-latest, server: redis, version: "7.4.11", floor: "7-4"}
          - {os: ubuntu-latest, server: redis, version: "8.0.6", floor: "8-0"}
          - {os: ubuntu-latest, server: redis, version: "8.2.10", floor: "8-0"}
          - {os: ubuntu-latest, server: redis, version: "8.4.7", floor: "8-0"}
          - {os: ubuntu-latest, server: redis, version: "8.6.7", floor: "8-0"}
          - {os: ubuntu-latest, server: redis, version: "8.8.3", floor: "8-0"}
          - {os: ubuntu-latest, server: redis, version: "8.10.2", floor: "8-0"}
          - {os: macos-latest, server: redis, version: "7.2.16", floor: "6-0"}
          - {os: macos-latest, server: redis, version: "8.10.2", floor: "8-0"}
          - {os: ubuntu-latest, server: valkey, version: "8.1.10", floor: "6-0"}
          - {os: ubuntu-latest, server: valkey, version: "9.1.2", floor: "6-0"}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Read runner image
        id: runner-image
        run: echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"

      - name: Cache server binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk-server
          key: sdk-server-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.image }}-${{ matrix.server }}-${{ matrix.version }}-${{ hashFiles('.github/servers.json', '.github/scripts/build-server.py') }}

      - name: Build or verify server
        run: |
          python3 .github/scripts/build-server.py "${{ matrix.server }}-${{ matrix.version }}" "$RUNNER_TEMP/sdk-server"
          echo "TEST_REDIS_SERVER_BIN=$RUNNER_TEMP/sdk-server/${{ matrix.server }}-server" >> "$GITHUB_ENV"

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }} -- -D warnings

      - name: Build debug
        run: cargo build --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }}

      - name: Build release
        run: cargo build --release --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }}

      - name: Test
        run: cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }}

      - name: Lint and test the system allocator fallback
        run: |
          cargo clippy --all-targets --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }},system-allocator-fallback -- -D warnings
          cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }},system-allocator-fallback --test system_allocator_fallback

      - name: Doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-default-features --features "all-features-but-xor min-redis-compatibility-version-${{ matrix.floor }}"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.server }}-${{ matrix.version }}-${{ matrix.floor }}
          path: |
            target/**/integration-test/**
            ${{ runner.temp }}/sdk-server-build.log
          if-no-files-found: ignore
          retention-days: 7

  bindings:
    # Generates the bindings with bindgen and fails if they differ from the
    # committed ones. One runner, so the result does not depend on each
    # runner's LLVM version.
    name: Check the committed bindings against bindgen
    runs-on: ubuntu-latest
    env:
      REDISMODULE_RS_CHECK_BINDINGS: "1"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build with bindgen
        run: cargo build --features bindgen-runtime

      - name: Clippy with bindgen
        run: cargo clippy --workspace --all-targets --features bindgen-runtime -- -D warnings

  deny:
    name: Check advisories, bans, licenses and sources with cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # Third-party actions are not allowed here, so install it with cargo;
      # the toolchain action's cache keeps it between runs.
      - name: Install cargo-deny
        run: command -v cargo-deny || cargo install cargo-deny --locked

      - name: cargo deny check
        run: cargo deny check

  msrv:
    # Without clang installed, so the default build with the committed
    # bindings is checked too.
    name: Check and run the unit tests with the minimum supported Rust (1.87).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.87"
          # The pinned-toolchain jobs deny warnings. Here a lint added after
          # 1.87, named in an allow attribute, would fail as an unknown lint.
          rustflags: ""

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Unit tests
        run: cargo test --lib
