name: CI

on: [pull_request]

jobs:
  test:
    name: "${{ matrix.os }} / API floor ${{ matrix.compatibility }} / Redis ${{ matrix.redis-runtime }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        compatibility: ["6-0", "6-2", "7-0", "7-2"]
        # These API feature selections are all exercised on the same Redis runtime.
        redis-runtime: ["7.2"]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Checkout redis sources
        uses: actions/checkout@v5
        with:
          submodules: recursive
          repository: redis/redis
          ref: ${{ matrix.redis-runtime }}
          path: redis

      - name: Install redis
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          cd redis
          make -j
          ./src/redis-server --version
          make install PREFIX=/usr/local
          redis-server --version

      - name: Install Clang (for bindgen)
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y libclang-dev
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            # Install LLVM which provides libclang
            brew install llvm
            # Set environment variables for bindgen to find libclang
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV
            echo "LLVM_CONFIG_PATH=$(brew --prefix llvm)/bin/llvm-config" >> $GITHUB_ENV
          fi

      - name: Install pinned toolchain
        # With no toolchain input, the action reads rust-toolchain.toml.
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --locked --no-default-features --features min-redis-compatibility-version-${{ matrix.compatibility }},bindgen-runtime

      - name: Build debug
        run: cargo build --locked --no-default-features --features min-redis-compatibility-version-${{ matrix.compatibility }},bindgen-runtime

      - name: Build release
        run: cargo build --release --locked --no-default-features --features min-redis-compatibility-version-${{ matrix.compatibility }},bindgen-runtime

      - name: Test
        run: cargo test --locked --no-default-features --features min-redis-compatibility-version-${{ matrix.compatibility }},bindgen-runtime

      - name: Doc
        run: cargo doc --locked --no-default-features --features "all-features-but-xor bindgen-runtime min-redis-compatibility-version-${{ matrix.compatibility }}"
