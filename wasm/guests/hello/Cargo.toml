[package]
name = "hello-guest"
version = "0.0.0"
edition = "2024"
publish = false

# A standalone workspace: guests build for wasm32-unknown-unknown.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# The same wasm-tools release as the host's wasmtime 36.
wit-bindgen = "0.44"
redis-wasm-guest = { path = "../../guest-sdk" }

[profile.release]
opt-level = "s"
lto = true
strip = true
