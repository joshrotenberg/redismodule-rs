[package]
name = "bench-guest"
version = "0.0.0"
edition = "2024"
publish = false

# A standalone workspace: guests build for wasm32-unknown-unknown.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# The same wasm-tools release as the host's wasmtime 36.
wit-bindgen = "0.44"

[profile.release]
opt-level = 3
lto = true
strip = true
