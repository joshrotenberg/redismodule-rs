name: Release-plz

on:
  push:
    branches:
      - master

jobs:
  # Release unpublished packages if the latest commit merged
  # a release PR into master
  release:
    # Publishing and release PRs belong to the upstream repository.
    if: github.repository == 'RedisLabsModules/redismodule-rs'
    name: Publish a new release to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
