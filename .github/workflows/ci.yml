name: CI

on:
  push:
    branches: [master, experiment/quickjs]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The default build, with the committed bindings, on the toolchain that
    # rust-toolchain.toml pins.
    name: Build and test (floor ${{ matrix.floor }}, ${{ matrix.server }} ${{ matrix.version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUST_TEST_THREADS: "4"
    strategy:
      fail-fast: false
      matrix:
        # Linux covers every API floor and newer server release lines. macOS
        # covers the lowest floor and the newest Redis release.
        include:
          - {os: ubuntu-latest, server: redis, version: "7.2.16", floor: "6-0"}
          - {os: ubuntu-latest, server: redis, version: "7.2.16", floor: "6-2"}
          - {os: ubuntu-latest, server: redis, version: "7.2.16", floor: "7-0"}
          - {os: ubuntu-latest, server: redis, version: "7.2.16", floor: "7-2"}
          - {os: ubuntu-latest, server: redis, version: "7.4.11", floor: "7-4"}
          - {os: ubuntu-latest, server: redis, version: "8.0.6", floor: "8-0"}
          - {os: ubuntu-latest, server: redis, version: "8.2.10", floor: "8-0"}
          - {os: ubuntu-latest, server: redis, version: "8.4.7", floor: "8-0"}
          - {os: ubuntu-latest, server: redis, version: "8.6.7", floor: "8-0"}
          - {os: ubuntu-latest, server: redis, version: "8.8.3", floor: "8-0"}
          - {os: ubuntu-latest, server: redis, version: "8.10.2", floor: "8-0"}
          - {os: macos-latest, server: redis, version: "7.2.16", floor: "6-0"}
          - {os: macos-latest, server: redis, version: "8.10.2", floor: "8-0"}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Read runner image
        id: runner-image
        run: echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"

      - name: Cache server binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk-server
          key: sdk-server-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.image }}-${{ matrix.server }}-${{ matrix.version }}-${{ hashFiles('.github/servers.json', '.github/scripts/build-server.py') }}

      - name: Build or verify server
        run: |
          python3 .github/scripts/build-server.py "${{ matrix.server }}-${{ matrix.version }}" "$RUNNER_TEMP/sdk-server"
          echo "TEST_REDIS_SERVER_BIN=$RUNNER_TEMP/sdk-server/${{ matrix.server }}-server" >> "$GITHUB_ENV"

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }} -- -D warnings

      - name: Build debug
        run: cargo build --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }}

      - name: Build release
        run: cargo build --release --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }}

      - name: Test
        run: cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }}

      - name: Check compile-fail error codes at each floor
        # One pinned-toolchain Linux Redis job for every API floor family.
        if: matrix.os == 'ubuntu-latest' && (matrix.version == '7.2.16' || matrix.version == '7.4.11' || matrix.version == '8.10.2')
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo test --workspace --doc --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }}

      - name: Test macro parsers
        run: cargo test -p redis-module-macros -p redis-module-macros-internals

      - name: Lint and test the system allocator fallback
        run: |
          cargo clippy --all-targets --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }},system-allocator-fallback -- -D warnings
          cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }},system-allocator-fallback --test system_allocator_fallback

      - name: Test the isolated parser example
        if: matrix.floor == '6-0'
        run: |
          cargo fmt --manifest-path examples/module-testing/Cargo.toml -- --check
          cargo fmt --manifest-path examples/module-testing/fuzz/Cargo.toml -- --check
          cargo clippy --manifest-path examples/module-testing/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path examples/module-testing/Cargo.toml

      - name: Check multi-consumer compatibility floors
        if: matrix.floor == '6-0'
        run: |
          cargo fmt --manifest-path examples/compatibility-floors/Cargo.toml --all -- --check
          python3 examples/compatibility-floors/check.py

      - name: Document SDK and macro workspace packages
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --no-default-features --features "all-features-but-xor min-redis-compatibility-version-${{ matrix.floor }}"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.server }}-${{ matrix.version }}-${{ matrix.floor }}
          path: |
            target/**/integration-test/**
            examples/compatibility-floors/target/check-logs/**
            ${{ runner.temp }}/sdk-server-build.log
          if-no-files-found: ignore
          retention-days: 7

  legacy-blocking:
    # The full integration suite needs newer APIs. This focused regression
    # exercises client decoding, blocking and timer protection on the oldest runtime.
    name: Blocking and timer lifecycle (Redis ${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: "6.0.20", floor: "6-0"}
          - {version: "6.2.24", floor: "6-2"}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Read runner image
        id: runner-image
        run: echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"

      - name: Cache server binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk-server
          key: sdk-server-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.image }}-redis-${{ matrix.version }}-${{ hashFiles('.github/servers.json', '.github/scripts/build-server.py') }}

      - name: Build or verify server
        run: |
          python3 .github/scripts/build-server.py redis-${{ matrix.version }} "$RUNNER_TEMP/sdk-server"
          echo "TEST_REDIS_SERVER_BIN=$RUNNER_TEMP/sdk-server/redis-server" >> "$GITHUB_ENV"

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Test client decoding at the oldest runtime
        env:
          TEST_REDIS_SERVER_LEGACY_OPTIONS: "1"
          RUST_TEST_THREADS: "4"
        run: |
          cargo build --example hello --example call_reply --example reply_types --example data_type --example try_lock --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }}
          # Configuration APIs and bind-error diagnostics differ on 6.0;
          # retain those harness cases in the full server matrix above.
          for test_name in \
            connection_tests::test_harness_partial_and_malformed_replies_close_connection \
            connection_tests::test_harness_unresponsive_listener_is_bounded \
            connection_tests::test_harness_rejects_a_different_process_on_the_port
          do
            cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }} --test utils "$test_name" -- --exact --list | tee "$RUNNER_TEMP/legacy-transport-tests.txt"
            grep -Fx -- "$test_name: test" "$RUNNER_TEMP/legacy-transport-tests.txt"
            cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }} --test utils "$test_name" -- --exact
          done
          for test_name in \
            test_harness_pipeline_error_drains_remaining_replies \
            test_harness_nested_error_preserves_reply_alignment \
            test_harness_resp2_and_resp3_decoding \
            test_call_reply_strings_are_bulk \
            test_reply_types_fall_back_before_redis_7 \
            test_reply_elements_match_their_aggregate_length \
            test_defrag_registration_warns_only_for_unsupported_code \
            test_context_try_lock_contention_release_and_unload \
            test_call_protocol_resets_to_resp2_without_newer_format_flags
          do
            cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }} --test integration "$test_name" -- --exact --list | tee "$RUNNER_TEMP/legacy-client-tests.txt"
            grep -Fx -- "$test_name: test" "$RUNNER_TEMP/legacy-client-tests.txt"
            cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }} --test integration "$test_name" -- --exact
          done

      - name: Test direct client blocking
        env:
          TEST_REDIS_SERVER_LEGACY_OPTIONS: "1"
        run: |
          cargo build --example block --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }}
          for test_name in \
            test_direct_client_blocking_rejects_denied_invocations \
            test_blocked_client_gets_exactly_one_reply
          do
            cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }} --test integration "$test_name" -- --exact --list | tee "$RUNNER_TEMP/legacy-blocking-tests.txt"
            grep -Fx -- "$test_name: test" "$RUNNER_TEMP/legacy-blocking-tests.txt"
            cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }} --test integration "$test_name" -- --exact
          done

      - name: Test typed timer lifecycle
        env:
          TEST_REDIS_SERVER_LEGACY_OPTIONS: "1"
          RUST_TEST_THREADS: "4"
        run: |
          cargo build --example timer --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }}
          for test_name in \
            test_typed_timer_cancellation_recovers_data_and_drops_captures_once \
            test_typed_timer_cancellation_destructor_panic_finishes_ownership \
            test_typed_timer_firing_passive_drop_panic_and_reentry \
            test_typed_timer_pending_unload_refusal_and_reload \
            test_typed_timer_init_rejects_creation_and_releases_owned_values \
            test_typed_timer_unload_phase_rejects_creation_and_restores_after_refusal
          do
            cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }} --test integration "$test_name" -- --exact --list | tee "$RUNNER_TEMP/legacy-timer-tests.txt"
            grep -Fx -- "$test_name: test" "$RUNNER_TEMP/legacy-timer-tests.txt"
            cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }} --test integration "$test_name" -- --exact
          done

      - name: Test unload refusal for ACL rules
        # Before 7.2 the unload goes ahead and the next ACL LIST stops the
        # server; the unload hook reads the rules through RM_Call.
        env:
          TEST_REDIS_SERVER_LEGACY_OPTIONS: "1"
        run: |
          cargo build --example hello --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }}
          test_name=unload_acl_rules::test_unload_is_refused_while_an_acl_rule_names_a_module_command
          cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }} --test integration "$test_name" -- --exact --list | tee "$RUNNER_TEMP/legacy-unload-acl-tests.txt"
          grep -Fx -- "$test_name: test" "$RUNNER_TEMP/legacy-unload-acl-tests.txt"
          cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }} --test integration "$test_name" -- --exact

      - name: Test replication refusal during a write pause
        # Redis 6.2 aborts when a module replicates during any client pause,
        # with or without AOF and replicas, and when a module call pauses
        # after the command queued replication. 6.0 has no write pause and
        # does not abort; the tests skip there, except the refusals of a
        # CLIENT PAUSE without a mode and of other CLIENT subcommands.
        env:
          TEST_REDIS_SERVER_LEGACY_OPTIONS: "1"
        run: |
          cargo build --example replicate --example lists --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }}
          cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }} --test integration replication_pause:: -- --list | tee "$RUNNER_TEMP/legacy-replication-tests.txt"
          for test_name in \
            replication_pause::test_replication_pause_refuses_replicate_from_a_read_only_command \
            replication_pause::test_replication_pause_refuses_replicate_verbatim \
            replication_pause::test_replication_pause_refuses_replicated_calls_without_running_them \
            replication_pause::test_replication_pause_refuses_calls_replicated_to_replicas_or_the_aof_only \
            replication_pause::test_replication_pause_refuses_replicate_from_a_timer \
            replication_pause::test_replication_pause_refuses_replicate_from_a_server_event \
            replication_pause::test_replication_pause_refuses_replicate_from_a_worker \
            replication_pause::test_replication_pause_refuses_replicate_in_transactions \
            replication_pause::test_replication_pause_refuses_write_commands_that_another_command_calls \
            replication_pause::test_replication_pause_lets_write_commands_replicate_in_the_transaction_that_pauses \
            replication_pause::test_replication_pause_lets_write_commands_replicate_each_way_in_the_transaction_that_pauses \
            replication_pause::test_replication_pause_refuses_client_pause_after_replicate_verbatim \
            replication_pause::test_replication_pause_refuses_client_pause_after_a_replicated_call \
            replication_pause::test_replication_pause_refuses_client_pause_after_a_lazy_expire \
            replication_pause::test_replication_pause_refuses_failover_after_replicate_verbatim \
            replication_pause::test_replication_pause_lets_calls_run_other_client_subcommands \
            replication_pause::test_replication_pause_lets_calls_pause_inside_a_transaction
          do
            grep -Fx -- "$test_name: test" "$RUNNER_TEMP/legacy-replication-tests.txt"
          done
          cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.floor }} --test integration replication_pause::

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-legacy-blocking-${{ matrix.version }}
          path: |
            target/**/integration-test/**
            ${{ runner.temp }}/sdk-server-build.log
          if-no-files-found: ignore
          retention-days: 7

  configuration-floor:
    # Native configuration APIs start at 7.0. This focused job also exercises
    # lifecycle fallbacks without the post-notification API added in 7.2.
    name: Configuration ownership (Redis 7.0.15)
    runs-on: ubuntu-latest
    env:
      RUST_TEST_THREADS: "4"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Read runner image
        id: runner-image
        run: echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"

      - name: Cache server binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk-server
          key: sdk-server-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.image }}-redis-7.0.15-${{ hashFiles('.github/servers.json', '.github/scripts/build-server.py') }}

      - name: Build or verify server
        run: |
          python3 .github/scripts/build-server.py redis-7.0.15 "$RUNNER_TEMP/sdk-server"
          echo "TEST_REDIS_SERVER_BIN=$RUNNER_TEMP/sdk-server/redis-server" >> "$GITHUB_ENV"

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build configuration examples
        run: |
          cargo build --no-default-features --features min-redis-compatibility-version-7-0 \
            --example configuration_ownership --example configuration \
            --example configuration_getter --example configuration_registration \
            --example parsed_configuration --example hello --example failed_load

      - name: Test configuration ownership
        run: |
          cargo test --no-default-features --features min-redis-compatibility-version-7-0 --lib configuration::
          cargo test --no-default-features --features min-redis-compatibility-version-7-0 --test integration configuration_ownership:: -- --list | tee "$RUNNER_TEMP/configuration-ownership-tests.txt"
          grep -E '^configuration_ownership::[^ ]+: test$' "$RUNNER_TEMP/configuration-ownership-tests.txt"
          cargo test --no-default-features --features min-redis-compatibility-version-7-0 --test integration configuration_ownership::

      - name: Test failed-load cleanup
        # Redis before 7.2.4 keeps a failed load's event subscriptions itself.
        run: |
          test_name=test_failed_load_leaves_no_event_subscriptions
          cargo test --no-default-features --features min-redis-compatibility-version-7-0 --test integration "$test_name" -- --exact --list | tee "$RUNNER_TEMP/failed-load-tests.txt"
          grep -Fx -- "$test_name: test" "$RUNNER_TEMP/failed-load-tests.txt"
          cargo test --no-default-features --features min-redis-compatibility-version-7-0 --test integration "$test_name" -- --exact

      - name: Test unload refusal for ACL rules
        # Redis 7.0 also leaves an unloaded command's ACL bits behind for the
        # next ACL LIST, and has selectors.
        run: |
          test_name=unload_acl_rules::test_unload_is_refused_while_an_acl_rule_names_a_module_command
          cargo test --no-default-features --features min-redis-compatibility-version-7-0 --test integration "$test_name" -- --exact --list | tee "$RUNNER_TEMP/unload-acl-tests.txt"
          grep -Fx -- "$test_name: test" "$RUNNER_TEMP/unload-acl-tests.txt"
          cargo test --no-default-features --features min-redis-compatibility-version-7-0 --test integration "$test_name" -- --exact

      - name: Test configuration behavior at the native API floor
        # Worker success/reload coverage needs the newer completion API. The
        # ownership tests above check fail-closed worker unload on this server.
        run: |
          for test_name in \
            test_configuration \
            test_string_configuration_getter_releases_replies \
            test_string_configuration_unload_releases_final_cached_reply \
            test_memory_configuration_takes_units \
            test_configuration_string_storage_utf8_and_binary_values \
            test_configuration_loadex_precedence_and_registration_validation \
            test_configuration_module_args_validate_numeric_range \
            test_configuration_module_args_bool_is_case_insensitive \
            test_configuration_module_args_reject_invalid_bool \
            test_configuration_module_args_keep_names_and_values_paired \
            test_configuration_module_args_validate_memory_range_after_units \
            test_configuration_registration_errors_fail_the_load \
            test_configuration_load_errors_fail_the_load \
            parsed_configuration_tests::test_parsed_configuration_multi_set_rollback_is_visible_to_observers \
            parsed_configuration_tests::test_parsed_configuration_updates_keep_raw_parsed_and_observers_consistent \
            parsed_configuration_tests::test_parsed_configuration_module_arguments_are_validated_before_init \
            parsed_configuration_tests::test_parsed_configuration_failed_load_and_in_place_reload
          do
            cargo test --no-default-features --features min-redis-compatibility-version-7-0 --test integration "$test_name" -- --exact --list | tee "$RUNNER_TEMP/configuration-floor-tests.txt"
            grep -Fx -- "$test_name: test" "$RUNNER_TEMP/configuration-floor-tests.txt"
            cargo test --no-default-features --features min-redis-compatibility-version-7-0 --test integration "$test_name" -- --exact
          done

      - name: Test replication refusal during a write pause
        # Redis 7.0 aborts when a module replicates during any client pause
        # once commands propagate, before the pause actions of 7.2, and when
        # a module call pauses after the command queued replication, a
        # lazy-expire deletion included.
        run: |
          cargo build --example replicate --example lists --no-default-features --features min-redis-compatibility-version-7-0
          cargo test --no-default-features --features min-redis-compatibility-version-7-0 --test integration replication_pause:: -- --list | tee "$RUNNER_TEMP/replication-pause-tests.txt"
          for test_name in \
            replication_pause::test_replication_pause_refuses_replicate_from_a_read_only_command \
            replication_pause::test_replication_pause_refuses_replicate_verbatim \
            replication_pause::test_replication_pause_refuses_replicated_calls_without_running_them \
            replication_pause::test_replication_pause_refuses_calls_replicated_to_replicas_or_the_aof_only \
            replication_pause::test_replication_pause_refuses_replicate_from_a_timer \
            replication_pause::test_replication_pause_refuses_replicate_from_a_server_event \
            replication_pause::test_replication_pause_refuses_replicate_from_a_worker \
            replication_pause::test_replication_pause_refuses_replicate_in_transactions \
            replication_pause::test_replication_pause_refuses_write_commands_that_another_command_calls \
            replication_pause::test_replication_pause_lets_write_commands_replicate_in_the_transaction_that_pauses \
            replication_pause::test_replication_pause_lets_write_commands_replicate_each_way_in_the_transaction_that_pauses \
            replication_pause::test_replication_pause_refuses_client_pause_after_replicate_verbatim \
            replication_pause::test_replication_pause_refuses_client_pause_after_a_replicated_call \
            replication_pause::test_replication_pause_refuses_client_pause_after_a_lazy_expire \
            replication_pause::test_replication_pause_refuses_failover_after_replicate_verbatim \
            replication_pause::test_replication_pause_lets_calls_run_other_client_subcommands \
            replication_pause::test_replication_pause_lets_calls_pause_inside_a_transaction
          do
            grep -Fx -- "$test_name: test" "$RUNNER_TEMP/replication-pause-tests.txt"
          done
          cargo test --no-default-features --features min-redis-compatibility-version-7-0 --test integration replication_pause::

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-configuration-floor
          path: |
            target/**/integration-test/**
            ${{ runner.temp }}/sdk-server-build.log
          if-no-files-found: ignore
          retention-days: 7

  defrag:
    name: Active defrag (Redis 8.10.2, jemalloc)
    runs-on: ubuntu-latest
    env:
      TEST_REDIS_REQUIRE_DEFRAG: "1"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Read runner image
        id: runner-image
        run: echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"

      - name: Cache server binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk-server
          key: sdk-server-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.image }}-redis-8.10.2-jemalloc-${{ hashFiles('.github/servers.json', '.github/scripts/build-server.py') }}

      - name: Build or verify jemalloc server
        run: |
          python3 .github/scripts/build-server.py redis-8.10.2 "$RUNNER_TEMP/sdk-server" --allocator jemalloc
          echo "TEST_REDIS_SERVER_BIN=$RUNNER_TEMP/sdk-server/redis-server" >> "$GITHUB_ENV"

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Exercise native defrag callbacks
        run: |
          cargo build --example data_type
          cargo test --test integration test_defrag -- --exact --list | tee "$RUNNER_TEMP/defrag-tests.txt"
          grep -Fx -- 'test_defrag: test' "$RUNNER_TEMP/defrag-tests.txt"
          cargo test --test integration test_defrag -- --exact --nocapture

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-defrag
          path: |
            target/**/integration-test/**
            ${{ runner.temp }}/sdk-server-build.log
          if-no-files-found: ignore
          retention-days: 7

  fuzz:
    name: Bounded parser fuzz and allocator controls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install pinned fuzz toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-01
          components: rust-src

      - name: Install pinned cargo-fuzz
        run: cargo +nightly-2026-08-01 install cargo-fuzz --version 0.13.2 --locked

      - name: Run bounded AddressSanitizer fuzz checks
        working-directory: examples/module-testing
        run: |
          mkdir -p fuzz/corpus/limit
          cp seeds/* fuzz/corpus/limit/
          cargo +nightly-2026-08-01 fuzz run limit --sanitizer address -- -runs=10000 -max_len=128 -timeout=2 -max_total_time=30 -seed=1
          cargo +nightly-2026-08-01 fuzz run limit --sanitizer address --features system-fallback -- -runs=10000 -max_len=128 -timeout=2 -max_total_time=30 -seed=1

      - name: Check disabled allocator fallback refuses startup
        working-directory: examples/module-testing
        run: |
          ulimit -c 0
          if cargo +nightly-2026-08-01 fuzz run limit --features sdk-allocator -- -runs=1 -timeout=2 > allocator-refusal.log 2>&1; then
            echo 'Expected the unavailable Redis allocator to refuse startup' >&2
            exit 1
          fi
          grep -F "Critical error: the Redis Allocator isn't available" allocator-refusal.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-fuzz
          path: |
            examples/module-testing/fuzz/artifacts/**
            examples/module-testing/fuzz/corpus/**
            examples/module-testing/allocator-refusal.log
            examples/module-testing/Cargo.lock
            examples/module-testing/fuzz/Cargo.lock
          if-no-files-found: ignore
          retention-days: 7

  bindings:
    # Generates the bindings with bindgen and fails if they differ from the
    # committed ones. One runner, so the result does not depend on each
    # runner's LLVM version.
    name: Check the committed bindings against bindgen
    runs-on: ubuntu-latest
    env:
      REDISMODULE_RS_CHECK_BINDINGS: "1"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build with bindgen
        run: cargo build --features bindgen-runtime

      - name: Clippy with bindgen
        run: cargo clippy --workspace --all-targets --features bindgen-runtime -- -D warnings

  deny:
    name: Check advisories, bans, licenses and sources with cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # Third-party actions are not allowed here, so install it with cargo;
      # the toolchain action's cache keeps it between runs.
      - name: Install cargo-deny
        run: command -v cargo-deny || cargo install cargo-deny --locked

      - name: cargo deny check
        run: cargo deny check

  msrv:
    # Without clang installed, so the default build with the committed
    # bindings is checked too.
    name: Check and run the unit tests with the minimum supported Rust (1.87).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.87"
          # The pinned-toolchain jobs deny warnings. Here a lint added after
          # 1.87, named in an allow attribute, would fail as an unknown lint.
          rustflags: ""

      - name: Check
        run: |
          for floor in 6-0 6-2 7-0 7-2 7-4 8-0; do
            cargo check --workspace --all-targets --no-default-features --features min-redis-compatibility-version-$floor
          done
          cargo test -p redis-module-macros -p redis-module-macros-internals

      - name: Unit tests
        run: |
          cargo test --lib
          cargo test --manifest-path examples/module-testing/Cargo.toml
          python3 examples/compatibility-floors/check.py
