name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The default build, with the committed bindings, on the toolchain that
    # rust-toolchain.toml pins.
    name: Build and test (floor ${{ matrix.redis-version[0] }}, Redis ${{ matrix.redis-version[1] }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        redis-version:
          - [6-0, "7.2"]
          - [6-2, "7.2"]
          - [7-0, "7.2"]
          - [7-2, "7.2"]
          - [7-4, "7.4"]
          - [8-0, "8.0"]
        # macOS runs the lowest and highest floors; Linux runs them all.
        exclude:
          - os: macos-latest
            redis-version: [6-2, "7.2"]
          - os: macos-latest
            redis-version: [7-0, "7.2"]
          - os: macos-latest
            redis-version: [7-2, "7.2"]
          - os: macos-latest
            redis-version: [7-4, "7.4"]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Checkout redis sources
        uses: actions/checkout@v5
        with:
          repository: redis/redis
          ref: ${{ matrix.redis-version[1] }}
          path: redis

      - name: Install redis
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          cd redis
          make -j
          ./src/redis-server --version
          make install PREFIX=/usr/local
          redis-server --version

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features --features min-redis-compatibility-version-${{ matrix.redis-version[0] }} -- -D warnings

      - name: Build debug
        run: cargo build --no-default-features --features min-redis-compatibility-version-${{ matrix.redis-version[0] }}

      - name: Build release
        run: cargo build --release --no-default-features --features min-redis-compatibility-version-${{ matrix.redis-version[0] }}

      - name: Test
        run: cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.redis-version[0] }}

      - name: Lint and test the system allocator fallback
        run: |
          cargo clippy --all-targets --no-default-features --features min-redis-compatibility-version-${{ matrix.redis-version[0] }},system-allocator-fallback -- -D warnings
          cargo test --no-default-features --features min-redis-compatibility-version-${{ matrix.redis-version[0] }},system-allocator-fallback --test system_allocator_fallback

      - name: Doc
        run: cargo doc --no-default-features --features "all-features-but-xor min-redis-compatibility-version-${{ matrix.redis-version[0] }}"

  bindings:
    # Generates the bindings with bindgen and fails if they differ from the
    # committed ones. One runner, so the result does not depend on each
    # runner's LLVM version.
    name: Check the committed bindings against bindgen
    runs-on: ubuntu-latest
    env:
      REDISMODULE_RS_CHECK_BINDINGS: "1"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build with bindgen
        run: cargo build --features bindgen-runtime

      - name: Clippy with bindgen
        run: cargo clippy --workspace --all-targets --features bindgen-runtime -- -D warnings

  deny:
    name: Check advisories, bans, licenses and sources with cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # Third-party actions are not allowed here, so install it with cargo;
      # the toolchain action's cache keeps it between runs.
      - name: Install cargo-deny
        run: command -v cargo-deny || cargo install cargo-deny --locked

      - name: cargo deny check
        run: cargo deny check

  msrv:
    # Without clang installed, so the default build with the committed
    # bindings is checked too.
    name: Check and run the unit tests with the minimum supported Rust (1.87).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.87"
          # The pinned-toolchain jobs deny warnings. Here a lint added after
          # 1.87, named in an allow attribute, would fail as an unknown lint.
          rustflags: ""

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Unit tests
        run: cargo test --lib
