name: Experimental auth controlled builds

on:
  pull_request:
    paths:
      - .github/experimental-auth/**
      - .github/scripts/auth-rc3-*.py
      - .github/workflows/experimental-auth-build.yml

permissions:
  contents: read

jobs:
  builds:
    name: Two pinned RC3 builds (no server execution)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Produce two controlled build witnesses
        run: python3 .github/scripts/auth-rc3-build.py "$RUNNER_TEMP/auth-rc3-builds"

      - name: Preserve both artifacts and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-rc3-builds-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/auth-rc3-builds/*.stdout
            ${{ runner.temp }}/auth-rc3-builds/*.stderr
            ${{ runner.temp }}/auth-rc3-builds/report.json
            ${{ runner.temp }}/auth-rc3-builds/*.tar.gz
            ${{ runner.temp }}/auth-rc3-builds/build-*/**
          if-no-files-found: error
          retention-days: 14
